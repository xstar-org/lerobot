services:
  sim:
    image: lerobot-sim-${SIM:-metaworld}:${SIM_TAG:-local}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.sim.${SIM:-metaworld}
      args:
        VLABENCH_ASSETS_REPO: lerobot/vlabench-assets
    gpus: all
    shm_size: 4gb
    healthcheck:
      test: [CMD, python, -c, "from lerobot.sim_server.client import SimClient; c=SimClient('tcp/127.0.0.1:7448', '${SIM:-metaworld}', 5); c.describe(); c.close()"]
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 12
  driver:
    image: lerobot-policy:${POLICY_TAG:-local}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.policy
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      sim:
        condition: service_healthy
    volumes:
      - ../../benchmarks/profiles:/profiles:ro
      - ${ARTIFACTS:-./artifacts}:/artifacts
    command:
      - lerobot-eval
      - --policy.path=${CHECKPOINT:-lerobot/smolvla_metaworld}
      - --env.type=sim
      - --env.endpoint=tcp/sim:7448
      - --env.deployment=${SIM:-metaworld}
      - --eval.profile=/profiles/${SIM:-metaworld}.yaml
      - --eval.n_episodes=${EPISODES:-1}
      - --eval.batch_size=${BATCH_SIZE:-1}
      - --policy.device=cuda
      - --output_dir=/artifacts
  policy:
    profiles: [remote]
    image: lerobot-policy:${POLICY_TAG:-local}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.policy
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${POLICY_CONFIG:-./policy_libero.yaml}:/config/server.yaml:ro
    command: [lerobot-policy-server, --config=/config/server.yaml]
